<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administrador</title>
    <link rel="stylesheet" href="estilos/panel_admin.css" />
    <style>
      .input-password {
        position: relative;
      }
      .input-password input {
        width: 100%;
        padding-right: 35px;
      }
      .toggle-pass {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
      }
      dialog {
        padding: 20px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      .acciones-modal {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="index.html" target="_blank">
          <img src="media/logo2.jpg" alt="Logo" class="logo-img" />
        </a>
        LlaqtaMarket Admin
      </div>
      <div class="nombre-cliente">Administrador</div>
    </header>

    <div class="contenedor">
      <aside class="sidebar">
        <ul>
          <li onclick="mostrarSeccion('clientes')">Clientes</li>
          <li onclick="mostrarSeccion('emprendedores')">Emprendedores</li>
          <li onclick="cerrarSesion()">Cerrar Sesión</li>
        </ul>
      </aside>

      <main id="contenidoPrincipal"></main>
    </div>

    <template id="clientes">
      <section>
        <h2>Gestión de Clientes</h2>
        <table id="tablaClientes">
          <thead>
            <tr>
              <th>ID Cliente</th>
              <th>Nombres</th>
              <th>Apellidos</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Fecha de Registro</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="listaClientes"></tbody>
        </table>
      </section>
    </template>

    <template id="emprendedores">
      <section>
        <h2>Gestión de Emprendedores</h2>
        <table id="tablaEmprendedores">
          <thead>
            <tr>
              <th>ID Emprendedor</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Nombre del Emprendimiento</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Fecha de Registro</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="listaEmprendedores"></tbody>
        </table>
      </section>
    </template>

    <dialog id="modalEditarEmprendedor">
      <h3>Editar Emprendedor</h3>
      <form id="formEditarEmprendedor">
        <input type="hidden" id="edit-id_emprendedor" />

        <label for="edit-nombre">Nombre</label>
        <input type="text" id="edit-nombre" required />

        <label for="edit-apellido">Apellido</label>
        <input type="text" id="edit-apellido" required />

        <label for="edit-nombre_emprendimiento"
          >Nombre del emprendimiento</label
        >
        <input type="text" id="edit-nombre_emprendimiento" required />

        <label for="edit-correo-empr">Correo</label>
        <input type="email" id="edit-correo-empr" required />

        <label for="edit-contrasenia-empr">Contraseña:</label>
        <div class="input-password">
          <input type="password" id="edit-contrasenia-empr" required />
          <button
            type="button"
            class="toggle-pass"
            onclick="togglePassword('edit-contrasenia-empr', this)"
          >
            👁
          </button>
        </div>

        <label for="edit-telefono-empr">Teléfono</label>
        <input type="text" id="edit-telefono-empr" required />

        <label for="edit-direccion-empr">Dirección</label>
        <input type="text" id="edit-direccion-empr" required />

        <label for="edit-descripcion">Descripción</label>
        <textarea id="edit-descripcion" required></textarea>

        <div class="acciones-modal">
          <button type="submit">Guardar Cambios</button>
          <button type="button" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </dialog>

    <dialog id="modalEditarCliente">
      <form method="dialog" id="formEditarCliente">
        <h3>Editar Cliente</h3>
        <input type="hidden" id="edit-id_cliente" />

        <label for="edit-nombres">Nombres:</label>
        <input type="text" id="edit-nombres" required />

        <label for="edit-apellidos">Apellidos:</label>
        <input type="text" id="edit-apellidos" required />

        <label for="edit-correo-cli">Correo:</label>
        <input type="email" id="edit-correo-cli" required />

        <label for="edit-contrasenia-cli">Contraseña:</label>
        <div class="input-password">
          <input type="password" id="edit-contrasenia-cli" required />
          <button
            type="button"
            class="toggle-pass"
            onclick="togglePassword('edit-contrasenia-cli', this)"
          >
            👁
          </button>
        </div>

        <label for="edit-direccion-cli">Dirección:</label>
        <input type="text" id="edit-direccion-cli" required />

        <label for="edit-telefono-cli">Teléfono:</label>
        <input type="text" id="edit-telefono-cli" required />

        <div class="acciones-modal">
          <button type="submit">Guardar</button>
          <button type="button" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </dialog>

    <script src="scripts/datos_ejemplo.js"></script>
    <script src="scripts/panel_admin.js"></script>
  </body>
</html>
