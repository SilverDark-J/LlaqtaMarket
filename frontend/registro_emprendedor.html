<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - LlaqtaMarket</title>
  <link rel="stylesheet" href="estilos/registro_emprendedor.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="registro-contenedor">
    <div class="formulario">
      <div class="empresa-info">
        <div class="logo">
          <img src="media/logo2.jpg" alt="Logo LlaqtaMarket" />
        </div>
        <div class="nombre-empresa">
          <h1>LlaqtaMarket</h1>
        </div>
      </div>

      <h2>Registro Emprendedor</h2>
      <form id="formRegistro" novalidate>
        <input type="text" id="nombres" name="nombres" placeholder="Ingrese su nombre" />
        <span class="error-text" id="error-nombres"></span>

        <input type="text" id="apellidos" name="apellidos" placeholder="Ingrese su apellido" />
        <span class="error-text" id="error-apellidos"></span>

        <input type="text" id="emprendimiento" name="emprendimiento" placeholder="Nombre del Emprendimiento" />
        <span class="error-text" id="error-emprendimiento"></span>

        <input type="email" id="correo" name="correo" placeholder="Correo" />
        <span class="error-text" id="error-correo"></span>

        <div class="input-password-wrapper">
          <input type="password" id="contrasenia" name="contrasenia" placeholder="Contraseña" />
          <span class="toggle-password-icon" onclick="togglePassword()">
            <i id="toggleIcon" class="fa-solid fa-eye"></i>
          </span>
        </div>
        <span class="error-text" id="error-contrasenia"></span> 

        <button type="submit">REGISTRARSE</button>
      </form>

      <p class="texto-login">
        <a href="login.html">¿Ya tienes una cuenta?</a>
      </p>
    </div>

    <div class="imagen-lateral">
      <img src="media/registro_emprendedor.jpg" alt="Registro emprendedor" />
    </div>
  </div>

  <script src="scripts/registro_emprendedor.js"></script>
</body>
</html>
