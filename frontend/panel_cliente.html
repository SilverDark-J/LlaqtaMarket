<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Cliente</title>
    <link rel="stylesheet" href="estilos/panel_cliente.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="productos.html" target="_blank">
          <img src="media/logo2.jpg" alt="Logo" class="logo-img" />
        </a>
        LlaqtaMarket
      </div>
      <div class="nombre-cliente">Bienvenido,</div>
      <button
        class="ir-productos"
        onclick="window.location.href='productos.html'"
      >
        X
      </button>
    </header>

    <div class="contenedor">
      <aside class="sidebar">
        <ul>
          <li onclick="mostrarSeccion('misPedidos')">Mis Pedidos</li>
          <li onclick="mostrarSeccion('configuracion')">Configuración</li>
          <li onclick="cerrarSesion()">Cerrar Sesión</li>
        </ul>
      </aside>

      <main id="contenidoPrincipal">
        <!-- Secciones dinámicas -->
      </main>
    </div>

    <!-- Plantillas -->
    <template id="misPedidos">
      <section>
        <h2>Mis Pedidos</h2>
        <div class="productos-grid" id="listaPedidos">
          <!-- Pedidos cargados dinámicamente -->
        </div>
      </section>
    </template>

    <template id="favoritos">
      <section>
        <h2>Mis Favoritos</h2>
        <div class="productos-grid" id="listaFavoritos">
          <!-- Productos favoritos -->
        </div>
      </section>
    </template>

    <template id="configuracion">
      <section class="contenedor-configuracion">
        <h2>Configuración</h2>
        <form
          onsubmit="guardarConfiguracionCliente(event)"
          class="formulario-configuracion"
        >
          <div class="campo">
            <label for="clienteNombre">Nombres:</label>
            <input type="text" id="clienteNombre" />
          </div>

          <div class="campo">
            <label for="clienteApellido">Apellidos:</label>
            <input type="text" id="clienteApellido" />
          </div>

          <div class="campo">
            <label for="clienteCorreo">Correo:</label>
            <input type="email" id="clienteCorreo" disabled />
          </div>

          <div class="campo">
            <label for="clienteContrasena">Contraseña:</label>
            <input
              type="password"
              id="clienteContrasena"
              placeholder="••••••••"
              required
            />
          </div>

          <div class="campo">
            <label for="clienteDireccion">Dirección:</label>
            <input
              type="text"
              id="clienteDireccion"
              placeholder="Av. Central 123"
            />
          </div>

          <div class="campo">
            <label for="clienteTelefono">Teléfono:</label>
            <input type="tel" id="clienteTelefono" placeholder="987654321" />
          </div>

          <div class="campo">
            <label for="clienteFechaRegistro">Fecha de Registro:</label>
            <input type="text" id="clienteFechaRegistro" disabled />
          </div>

          <button type="submit">Actualizar</button>
        </form>
      </section>
    </template>

    <script src="scripts/datos_ejemplo.js"></script>
    <script src="scripts/panel_cliente.js"></script>
  </body>
</html>
